<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PayPilot — Adaptive Business Operating Platform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --pri:#0070E0;--navy:#003087;--pp-blue:#0079C1;
  --bg:#F7FAFD;--card:#FFFFFF;--tx:#141C2E;--bt:#0D172A;--bx:#FFFFFF;
  --g:#F0F5FA;--mu:#5A6E8C;--bd:#E2EAF2;--sh:0 4px 20px rgba(0,48,135,.06);
  --ok:#0E9F6E;--wa:#C27803;--er:#D14343;
  --print-bg:#EBF4FF;--print-acc:#0070E0;--print-tx:#003087;--print-bd:#C8E1FF;
  --bakery-bg:#FFF0F5;--bakery-acc:#D81B60;--bakery-tx:#880E4F;--bakery-bd:#FFD1E3;
  --soft-bg:#E8F8F0;--soft-acc:#0E9F6E;--soft-tx:#065F46;--soft-bd:#BAEED5;
  --design-bg:#F3EFFF;--design-acc:#7C3AED;--design-tx:#4C1D95;--design-bd:#DDD1FE;
  box-sizing:border-box
}
:root[data-theme="dark"]{
  --bg:#0A1326;--card:#101D36;--tx:#EAF1FB;--bt:#FFFFFF;--bx:#0A1326;
  --g:#162544;--mu:#8EA3C7;--bd:#22365D;--sh:0 4px 24px rgba(0,0,0,.4);
  --pri:#3892F7;--pp-blue:#38A5FF;
  --print-bg:#12284D;--print-bd:#22447A;--bakery-bg:#3B1226;--bakery-bd:#612040;
  --soft-bg:#0F3323;--soft-bd:#1C523B;--design-bg:#27194A;--design-bd:#432B7D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Plus Jakarta Sans',Inter,system-ui,sans-serif;transition:background .2s,color .2s}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;letter-spacing:-.03em}h2{font-size:1.6rem}h3{font-size:1.15rem}h4{font-size:1rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.mu{color:var(--mu)}.sm{font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:99px;padding:.62em 1.35em;font:700 .92rem 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:var(--bt);color:var(--bx);transition:all .18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,112,224,.2)}
.btn.s{background:var(--card);color:var(--tx);border-color:var(--bd)}
.btn.g{background:var(--g);color:var(--tx);border-color:transparent}
.btn.d{color:var(--er);background:var(--card);border-color:var(--bd)}
.btn.ok-btn{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.paypal{background:#FFC439;color:#111;border-color:#E0A820;font-weight:800}
.btn.paypal:hover{background:#F2BA36;box-shadow:0 6px 18px rgba(255,196,57,.4)}
.btn.portal-switch{background:linear-gradient(135deg,var(--navy),var(--pri));color:#fff;border:none;box-shadow:0 3px 12px rgba(0,48,135,.2)}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:20px;padding:24px;box-shadow:var(--sh)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 95%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
header.top .wrap{display:flex;align-items:center;gap:18px;height:66px}
.logo{font-weight:800;font-size:1.25rem;color:var(--navy);display:flex;gap:10px;align-items:center}
[data-theme=dark] .logo{color:var(--tx)}
.pp-svg{width:22px;height:26px;flex-shrink:0}
nav.l{display:flex;gap:18px;margin-left:auto;align-items:center;font-weight:600}
nav.l a:hover{color:var(--pri)}
.tg{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:.4em .75em;cursor:pointer;font:600 .82rem 'Plus Jakarta Sans'}
.sec{padding:44px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:.4em 1em;border:1.5px solid var(--bd);border-radius:99px;background:var(--card);font-weight:600;font-size:.85rem;cursor:pointer;margin:0 6px 8px 0;color:var(--tx);transition:all .15s}
.chip.on,.chip:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.bd{display:inline-flex;align-items:center;gap:5px;padding:.24em .8em;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--g);color:var(--tx)}
.bd.ok{background:rgba(14,159,110,.14);color:var(--ok)}
.bd.wa{background:rgba(194,120,3,.15);color:var(--wa)}
.bd.er{background:rgba(209,67,67,.14);color:var(--er)}
.bd.ai{background:linear-gradient(135deg,rgba(0,112,224,.12),rgba(14,159,110,.12));color:var(--pri);border:1px solid rgba(0,112,224,.2)}
.pg{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}
.pg b{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--ok));transition:width .4s}
.emp{text-align:center;padding:52px 24px;border:2px dashed var(--bd);border-radius:22px;background:var(--card)}
.emp .ic{width:64px;height:64px;border-radius:50%;background:var(--g);display:grid;place-items:center;margin:0 auto 16px}
label{display:block;font-weight:700;font-size:.88rem;margin-bottom:6px}
input,select,textarea{width:100%;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:.7em .95em;font:500 .95rem 'Plus Jakarta Sans',sans-serif;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(0,112,224,.12)}
.f{margin-bottom:16px}
.er-msg{color:var(--er);font-size:.82rem;min-height:1.1em;margin-top:4px}
.crumb{font-size:.85rem;color:var(--mu);margin-bottom:16px}
.crumb a:hover{color:var(--pri)}
footer{background:var(--navy);color:#C9D7F0;padding:44px 0;margin-top:48px}
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--bd);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.side a{display:flex;gap:11px;padding:.65em .95em;border-radius:12px;font-weight:600;color:var(--mu);margin:3px 0;align-items:center;font-size:.92rem}
.side a:hover{background:var(--g);color:var(--pri)}
.side a.on{background:var(--g);color:var(--pri);font-weight:700}
.main{min-width:0}
.bar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--bd);background:var(--card)}
.cont{padding:28px;max-width:1140px}
.mb{display:none}
.ms{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--bd)}
.ms.d .ms-title{text-decoration:line-through;color:var(--mu)}
.modal{position:fixed;inset:0;background:rgba(8,18,36,.55);display:grid;place-items:center;z-index:30;padding:16px}
.modal .card{max-width:620px;width:100%;max-height:90vh;overflow:auto}
.wk{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:10px;overflow-x:auto}
.wk div{border:1px solid var(--bd);border-radius:14px;padding:12px;min-height:120px;background:var(--card);font-size:.85rem}
.hx{text-align:center;padding:60px 20px 32px}
.hx h1{max-width:920px;margin:0 auto 16px}
.hx>p{max-width:640px;margin:0 auto 28px;font-size:1.15rem;color:var(--mu)}

/* Pastel Hero Category Cards */
.cat-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:36px}
.cat-box{border-radius:24px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;min-height:380px;border:2px solid transparent;transition:all .2s;text-align:left}
.cat-box:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.08)}
.badge-circle{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.04)}

/* Product Cards */
.prod-card{border:1.5px solid var(--bd);border-radius:20px;padding:18px;background:var(--card);cursor:pointer;transition:all .18s;display:flex;flex-direction:column}
.prod-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,112,224,.1);border-color:var(--pri)}
.prod-card.selected{border-color:var(--pri);background:var(--g)}

/* Resource Cards */
.res-card{border:1.5px solid var(--bd);border-radius:18px;padding:20px;background:var(--card);transition:all .18s}
.res-card:hover{box-shadow:0 6px 20px rgba(0,112,224,.08)}
.res-card.shortage{border-color:#E74C3C;background:rgba(231,76,60,.03)}

/* Flowchart */
.flow-step{background:var(--card);border-radius:16px;padding:12px 14px;text-align:center;flex:1;min-width:115px}
.flow-arr{font-size:1.3rem;font-weight:800;color:var(--pri);flex-shrink:0}

/* Option choice in Onboarding */
.opt-choice{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--bd);border-radius:14px;padding:13px 16px;margin-bottom:10px;cursor:pointer;background:var(--card);transition:all .15s}
.opt-choice:hover,.opt-choice.selected{border-color:var(--pri);background:var(--g)}
.opt-choice input{width:18px;height:18px;margin-top:2px;cursor:pointer;flex-shrink:0}

/* Toast Notification */
.toast{position:fixed;bottom:24px;right:24px;z-index:99;background:var(--ok);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;box-shadow:0 6px 22px rgba(0,0,0,.2);animation:slideup .3s ease}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Interactive Analytics & Chart Tooltips */
.chart-tip{position:fixed;pointer-events:none;background:#0D172A;color:#FFFFFF;padding:8px 12px;border-radius:10px;font-size:.78rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:9999;opacity:0;transition:opacity .15s ease;transform:translate(-50%, -100%);margin-top:-10px;white-space:nowrap;line-height:1.4}
.chart-tip.show{opacity:1}
.chart-tip b{color:#38A5FF}
.chart-point{cursor:pointer;transition:r .2s ease, fill .2s ease}
.chart-point:hover{r:8px}
.donut-seg{cursor:pointer;transition:stroke-width .2s ease, opacity .2s ease}
.donut-seg:hover{stroke-width:26;opacity:.9}
.res-bar-track{height:9px;background:var(--g);border-radius:99px;overflow:hidden;position:relative;display:flex}
.res-bar-fill{height:100%;border-radius:99px;transition:width .4s ease}

@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;left:-270px;width:256px;z-index:25;transition:left .2s}.side.o{left:0}.mb{display:inline-block}.cont{padding:16px}.bar{padding:12px 16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="md"></div>
<div id="toast-box"></div>

const API_BASE = (typeof window !== 'undefined' && window.location.protocol === 'file:') ? 'http://localhost:3000' : '';

async function apiFetch(url, options = {}) {
  const target = (url.startsWith('http') ? url : (API_BASE + url));
  try {
    return await fetch(target, options);
  } catch (err) {
    if (err.message && (err.message.toLowerCase().includes('fetch') || err.message.includes('NetworkError'))) {
      throw new Error(`Cannot connect to PayPilot backend at ${API_BASE || window.location.origin}. Please run: npm start`);
    }
    throw err;
  }
}

/* Interactive Chart Tooltip Handlers */
function showChartTip(e, html) {
  let tip = document.getElementById('chart-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'chart-tip';
    tip.className = 'chart-tip';
    document.body.appendChild(tip);
  }
  tip.innerHTML = html;
  tip.classList.add('show');
  const rect = e.currentTarget.getBoundingClientRect();
  tip.style.left = Math.round(rect.left + rect.width / 2) + 'px';
  tip.style.top = Math.round(rect.top - 6) + 'px';
}
function hideChartTip() {
  const tip = document.getElementById('chart-tip');
  if (tip) tip.classList.remove('show');
}

/* 1. Project Risk Trend — Interactive Line Chart */
function renderRiskTrendChart(projects, allCompleted) {
  if (allCompleted || !projects || projects.length === 0) {
    return `<div style="text-align:center;padding:32px 14px;margin:auto">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:rgba(14,159,110,.12);color:var(--ok);margin-bottom:10px">
        ${SVG.check}
      </div>
      <div style="font-weight:700;color:var(--ok);font-size:1.02rem">Zero Delay Risks Detected</div>
      <p class="sm mu" style="margin:4px auto 0;max-width:300px">
        ${allCompleted ? 'All workspace projects have been completed successfully.' : 'No active projects currently in progress.'}
      </p>
    </div>`;
  }

  const N = projects.length;
  const W = 460;
  const H = 150;
  const padL = 42;
  const padR = 20;
  const padT = 18;
  const padB = 32;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const points = projects.map((p, i) => {
    const x = N === 1 ? padL + plotW / 2 : padL + (i / (N - 1)) * plotW;
    const clampedRisk = Math.min(100, Math.max(0, p.riskPct || 0));
    const y = (padT + plotH) - (clampedRisk / 100) * plotH;
    return { x: Math.round(x), y: Math.round(y), p };
  });

  let lineD = '';
  let areaD = '';
  if (N === 1) {
    lineD = `M ${padL} ${points[0].y} L ${W - padR} ${points[0].y}`;
    areaD = `M ${padL} ${points[0].y} L ${W - padR} ${points[0].y} L ${W - padR} ${padT + plotH} L ${padL} ${padT + plotH} Z`;
  } else {
    lineD = `M ${points[0].x} ${points[0].y}` + points.slice(1).map(pt => ` L ${pt.x} ${pt.y}`).join('');
    areaD = `M ${points[0].x} ${points[0].y}` + points.slice(1).map(pt => ` L ${pt.x} ${pt.y}`).join('') + ` L ${points[N - 1].x} ${padT + plotH} L ${points[0].x} ${padT + plotH} Z`;
  }

  const gridY = [0, 25, 50, 75, 100].map(val => ({
    val,
    y: Math.round((padT + plotH) - (val / 100) * plotH)
  }));

  const maxRisk = Math.max(...projects.map(p => p.riskPct || 0));
  const strokeColor = maxRisk >= 60 ? '#D14343' : maxRisk >= 35 ? '#C27803' : 'var(--ok)';

  return `<div style="position:relative;width:100%">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;overflow:visible">
      <defs>
        <linearGradient id="trendAreaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.0"/>
        </linearGradient>
      </defs>

      <!-- Reference Grid -->
      ${gridY.map(g => `
        <line x1="${padL}" y1="${g.y}" x2="${W - padR}" y2="${g.y}" stroke="var(--bd)" stroke-dasharray="3,3" stroke-width="1"/>
        <text x="${padL - 8}" y="${g.y + 3}" text-anchor="end" font-size="9" font-weight="600" fill="var(--mu)">${g.val}%</text>
      `).join('')}

      <!-- Area fill -->
      <path d="${areaD}" fill="url(#trendAreaGrad)"/>

      <!-- Trend Line -->
      <path d="${lineD}" fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Data Points -->
      ${points.map((pt, idx) => {
        const p = pt.p;
        const ptColor = p.riskPct >= 60 ? '#D14343' : p.riskPct >= 35 ? '#C27803' : 'var(--ok)';
        const tipText = `<b>${esc(p.title)}</b><br><span style="color:#8EA3C7">Deadline:</span> <b>${esc(p.deadline)}</b><br><span style="color:#8EA3C7">ML Delay Risk:</span> <b style="color:${ptColor}">${p.riskPct}% (${esc(p.riskLevel)})</b><br><span style="color:#8EA3C7">Remaining Days:</span> <b>${p.remDays}d</b>`;
        return `
          <g>
            <circle cx="${pt.x}" cy="${pt.y}" r="5.5" fill="${ptColor}" stroke="var(--card)" stroke-width="2" class="chart-point"
              onmouseenter="showChartTip(event, '${tipText.replace(/'/g, "\\'")}')" onmouseleave="hideChartTip()"/>
            <text x="${pt.x}" y="${padT + plotH + 16}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--mu)">P${idx + 1}</text>
          </g>
        `;
      }).join('')}
    </svg>
  </div>`;
}

/* 2. Risk Distribution — Interactive Doughnut Chart */
function renderRiskDonutChart(projects, allCompleted) {
  const H = projects.filter(p => p.riskPct >= 60 || p.riskLevel === 'Critical' || p.riskLevel === 'High').length;
  const M = projects.filter(p => (p.riskPct >= 35 && p.riskPct < 60) || p.riskLevel === 'Medium').length;
  const L = projects.filter(p => p.riskPct < 35 && p.riskLevel !== 'High' && p.riskLevel !== 'Critical' && p.riskLevel !== 'Medium').length;
  const Total = projects.length;

  const C = 377; // 2 * PI * 60

  if (allCompleted || Total === 0) {
    return `<div style="display:flex;flex-direction:column;align-items:center;padding:12px 0">
      <div style="position:relative;width:150px;height:150px;margin-bottom:12px">
        <svg viewBox="0 0 160 160" style="width:100%;height:100%;display:block">
          <circle cx="80" cy="80" r="54" fill="none" stroke="var(--ok)" stroke-width="18" stroke-dasharray="339.3" stroke-dashoffset="0"/>
          <text x="80" y="78" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ok)">✓</text>
          <text x="80" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="var(--mu)">All Clear</text>
        </svg>
      </div>
      <div style="width:100%;max-width:240px">
        <div class="row sp" style="font-size:.82rem;padding:3px 0"><span class="row" style="gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:#D14343"></span>High Risk</span><b>0</b></div>
        <div class="row sp" style="font-size:.82rem;padding:3px 0"><span class="row" style="gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:#C27803"></span>Medium Risk</span><b>0</b></div>
        <div class="row sp" style="font-size:.82rem;padding:3px 0"><span class="row" style="gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:var(--ok)"></span>Low / On Track</span><b>0</b></div>
      </div>
    </div>`;
  }

  const lenH = Math.round((H / Total) * C * 10) / 10;
  const lenM = Math.round((M / Total) * C * 10) / 10;
  const lenL = Math.round((L / Total) * C * 10) / 10;

  const tipH = `<b>High / Critical Risk</b><br>${H} active project${H > 1 ? 's' : ''} (${Math.round((H / Total) * 100)}%)<br><span style="color:#D14343">Requires recovery intervention</span>`;
  const tipM = `<b>Medium Risk</b><br>${M} active project${M > 1 ? 's' : ''} (${Math.round((M / Total) * 100)}%)<br><span style="color:#C27803">Buffer monitored closely</span>`;
  const tipL = `<b>Low / On Track</b><br>${L} active project${L > 1 ? 's' : ''} (${Math.round((L / Total) * 100)}%)<br><span style="color:var(--ok)">Operating on schedule</span>`;

  return `<div style="display:flex;flex-direction:column;align-items:center;padding:6px 0">
    <div style="position:relative;width:150px;height:150px;margin-bottom:12px">
      <svg viewBox="0 0 160 160" style="width:100%;height:100%;display:block">
        <circle cx="80" cy="80" r="54" fill="none" stroke="var(--g)" stroke-width="18"/>
        ${lenH > 0 ? `
          <circle cx="80" cy="80" r="54" fill="none" stroke="#D14343" stroke-width="18"
            stroke-dasharray="${lenH} ${C - lenH}" stroke-dashoffset="0"
            transform="rotate(-90 80 80)" class="donut-seg"
            onmouseenter="showChartTip(event, '${tipH.replace(/'/g, "\\'")}')" onmouseleave="hideChartTip()"/>
        ` : ''}
        ${lenM > 0 ? `
          <circle cx="80" cy="80" r="54" fill="none" stroke="#C27803" stroke-width="18"
            stroke-dasharray="${lenM} ${C - lenM}" stroke-dashoffset="-${lenH}"
            transform="rotate(-90 80 80)" class="donut-seg"
            onmouseenter="showChartTip(event, '${tipM.replace(/'/g, "\\'")}')" onmouseleave="hideChartTip()"/>
        ` : ''}
        ${lenL > 0 ? `
          <circle cx="80" cy="80" r="54" fill="none" stroke="var(--ok)" stroke-width="18"
            stroke-dasharray="${lenL} ${C - lenL}" stroke-dashoffset="-${lenH + lenM}"
            transform="rotate(-90 80 80)" class="donut-seg"

function renderResourceBarChart(resourcesData, category) {
  const normCat = (category || 'Printing').toLowerCase();

  const defaults = {
    printing: [
      { name: 'Ceramic Sublimation Mugs', type: 'material', available: 110, required: 40, unit: 'units', leadTime: 3 },
      { name: 'Apparel Blanks (Cotton T-Shirts)', type: 'material', available: 85, required: 30, unit: 'shirts', leadTime: 2 },
      { name: 'Ultra-HD Sublimation Ink Set', type: 'material', available: 14, required: 6, unit: 'cartridges', leadTime: 2 },
      { name: 'Heavyweight Outdoor Vinyl Roll', type: 'material', available: 28, required: 12, unit: 'rolls', leadTime: 3 },
      { name: 'Heat Press Equipment Stations', type: 'equipment', available: 4, required: 3, unit: 'machines', leadTime: 1 }
    ],
    bakery: [
      { name: 'Organic Pastry & Bread Flour', type: 'material', available: 140, required: 55, unit: 'kg', leadTime: 2 },
      { name: 'Grass-Fed European Butter', type: 'material', available: 50, required: 22, unit: 'kg', leadTime: 1 },
      { name: 'Belgian Couverture Chocolate', type: 'material', available: 35, required: 18, unit: 'kg', leadTime: 3 },
      { name: 'Royal Icing & Sugar Blends', type: 'material', available: 25, required: 10, unit: 'kg', leadTime: 2 },
      { name: 'Commercial Convection Ovens', type: 'equipment', available: 3, required: 2, unit: 'ovens', leadTime: 1 }
    ],
    soft: [
      { name: 'Senior Full-Stack Dev Hours', type: 'staff', available: 160, required: 110, unit: 'hours', leadTime: 1 },
      { name: 'Cloud CI/CD Build Quota', type: 'infrastructure', available: 500, required: 320, unit: 'mins', leadTime: 1 },
      { name: 'QA & Security Audit Allocation', type: 'staff', available: 80, required: 45, unit: 'hours', leadTime: 2 },
      { name: 'Dedicated Staging Environments', type: 'infrastructure', available: 5, required: 3, unit: 'instances', leadTime: 1 },
      { name: 'PostgreSQL Database Capacity', type: 'storage', available: 250, required: 130, unit: 'GB', leadTime: 1 }
    ],
    design: [
      { name: 'Creative Art Director Hours', type: 'staff', available: 120, required: 75, unit: 'hours', leadTime: 1 },
      { name: 'Figma Enterprise Workspace Seats', type: 'software', available: 8, required: 6, unit: 'seats', leadTime: 1 },
      { name: 'High-Res Vector Asset Licenses', type: 'assets', available: 100, required: 40, unit: 'licenses', leadTime: 1 },
      { name: '3D GPU Cloud Render Hours', type: 'infrastructure', available: 80, required: 30, unit: 'hours', leadTime: 2 },
      { name: 'Client Presentation Review Slots', type: 'staff', available: 20, required: 12, unit: 'sessions', leadTime: 1 }
    ]
  };

  const catKey = normCat.includes('print') ? 'printing' : (normCat.includes('bake') || normCat.includes('food')) ? 'bakery' : (normCat.includes('dev') || normCat.includes('software')) ? 'soft' : 'design';

  let list = [];
  if (resourcesData && Array.isArray(resourcesData.resources) && resourcesData.resources.length > 0) {
    list = resourcesData.resources.slice(0, 5).map(r => ({
      name: r.name,
      type: r.type || 'material',
      available: Number(r.available_quantity) || 0,
      required: Number(r.required_quantity) || 0,
      unit: r.unit || 'units',
      leadTime: Number(r.supplier_lead_time_days) || 3
    }));
  } else {
    list = defaults[catKey] || defaults.printing;
  }

  return `<div style="display:flex;flex-direction:column;gap:12px">
    ${list.map(r => {
      const isShort = r.available < r.required;
      const deficit = isShort ? (r.required - r.available) : 0;
      const buffer = isShort ? 0 : (r.available - r.required);
      const maxVal = Math.max(r.available, r.required, 1);
      const reqPct = Math.min(100, Math.round((r.required / maxVal) * 100));
      const barColor = isShort ? '#D14343' : 'var(--pri)';
      const tipText = `<b>${esc(r.name)}</b><br><span style="color:#8EA3C7">Available:</span> <b>${r.available} ${esc(r.unit)}</b><br><span style="color:#8EA3C7">Committed:</span> <b>${r.required} ${esc(r.unit)}</b><br><span style="color:${isShort ? '#D14343' : 'var(--ok)'}">${isShort ? `Deficit: -${deficit} ${esc(r.unit)} (Lead Time: ${r.leadTime}d)` : `Safe Buffer: +${buffer} ${esc(r.unit)}`}</span>`;

      return `
        <div class="res-bar-row" style="cursor:pointer" onmouseenter="showChartTip(event, '${tipText.replace(/'/g, "\\'")}')" onmouseleave="hideChartTip()">
          <div class="row sp" style="margin-bottom:6px">
            <div class="row" style="gap:8px">
              <b style="font-size:.9rem">${esc(r.name)}</b>
              <span class="bd" style="font-size:.7rem;background:var(--g);text-transform:capitalize">${esc(r.type)}</span>
            </div>
            ${isShort
              ? `<span class="bd er" style="font-size:.74rem">Shortage: -${deficit} ${esc(r.unit)}</span>`
              : `<span class="bd ok" style="font-size:.74rem">Safe Buffer: +${buffer} ${esc(r.unit)}</span>`
            }
          </div>
          <div style="background:var(--card);border:1px solid var(--bd);border-radius:99px;height:12px;overflow:hidden;position:relative;display:flex">
            <div style="width:${reqPct}%;height:100%;background:${barColor};transition:width .4s ease"></div>
          </div>
          <div class="row sp sm mu" style="margin-top:4px;font-size:.78rem">
            <span>Committed: <b>${r.required} ${esc(r.unit)}</b></span>
            <span>In Stock: <b>${r.available} ${esc(r.unit)}</b></span>
          </div>
        </div>
      `;
    }).join('')}
  </div>`;
}

const A = {
  theme() {
    const r = document.documentElement;
    r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('pp-theme', r.dataset.theme); } catch(e) {}
  },
  switchPortal(target) {
    S.portal = target;
    try { localStorage.setItem('pp-portal', target); } catch(e) {}
    location.hash = target === 'owner' ? '#/owner/dashboard' : '#/marketplace';
  },
  cat(c) { S.cat = c; R(); },
  modal(h) {
    $('#md').innerHTML = h ? `<div class="modal" onclick="if(event.target===this)A.modal()"><div class="card">${h}</div></div>` : '';
  },
  switchBusiness(bizId) {
    const found = S.allBizList.find(b => b.id === bizId);
    if (found) {
      S.biz = found;
      try { localStorage.setItem('pp-current-biz-id', bizId); } catch(_) {}
      A.loadRequests().then(() => R());
    }
  },
  async deleteBusiness(bizId) {
    const b = S.allBizList.find(x => x.id === bizId);
    const name = b ? b.name : 'this business';
    if (!confirm(`Delete "${name}"?\n\nThis removes this business, its orders, projects and resources. Other businesses are unaffected.`)) return;
    try {
      const res = await apiFetch(`/api/businesses/${bizId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error((await res.json()).message || 'Failed to delete');
      showToast(`"${name}" deleted.`);
      S.biz = null;
      localStorage.removeItem('pp-current-biz-id');
      await A.loadBusinesses();
      await A.loadRequests();
      location.hash = '#/owner/dashboard';
      R();
    } catch(err) { alert('Delete error: ' + err.message); }
  },
  async deleteRequest(reqId) {
    if (!confirm('Delete this customer order?')) return;
    try {
      const res = await apiFetch(`/api/requests/${reqId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error((await res.json()).message || 'Failed');
      A.modal();
      await A.loadRequests();
      showToast('Order removed.');
      R();
    } catch(err) { alert('Error: ' + err.message); }
  },
  async deleteProject(projId) {
    if (!confirm('Delete this project and all its milestones?')) return;
    try {
      const res = await apiFetch(`/api/requests/projects/${projId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error((await res.json()).message || 'Failed');
      await A.loadRequests();
      showToast('Project removed.');
      R();

  async resetAllData() {
    if (!confirm('RESET ALL APPLICATION DATA?\n\nThis clears all businesses, orders, projects and resources for a clean slate presentation.\nTrained ML models and datasets remain intact.\n\nProceed?')) return;
    try {
      const res = await apiFetch('/api/cleanup/reset-all', { method: 'POST' });

      showToast('Application reset. Clean slate ready.');

      localStorage.removeItem('pp-current-biz-id');

      location.hash = '#/marketplace';
      R();
    } catch(err) { alert('Reset error: ' + err.message); }
  },

  // Customer order submission: Price is automatically Product Price * Qty (No Budget input)
  async submitReq(businessId) {
    const form = S.orderForm;
    const v = k => ($('#' + k)?.value || '').trim();

    const errors = {};
    const title = v('rq');
    const notes = v('ds');
    const deadline = v('dl');
    const qty = parseInt($('#qt')?.value || '1', 10);

    if (!form.selectedProduct && title.length < 3) errors.rq = 'Please choose a product or enter an order title.';
    if (!deadline) errors.dl = 'Please select a required deadline date.';
    if (!(qty >= 1)) errors.qt = 'Quantity must be at least 1.';

    document.querySelectorAll('[data-e]').forEach(x => x.textContent = errors[x.dataset.e] || '');
    if (Object.keys(errors).length) return;

    const btn = $('#sub_req_btn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Placing Order...'; }

    const prod = form.selectedProduct;
    const reqTitle = prod ? `${prod.name} (${qty} ${prod.unit})` : title;
    const description = notes || (prod ? `${prod.desc}` : 'Standard customized client order');
    const calculatedBudget = prod ? (prod.priceFrom * qty).toFixed(2) : '50.00';

    try {
      const res = await apiFetch('/api/requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ businessId, requestTitle: reqTitle, description, budget: calculatedBudget, deadline, quantity: qty })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed to submit order');

      await A.loadRequests();

      $('#rf').innerHTML = `<div class="emp" style="border-color:var(--ok)">
        <div class="ic" style="color:var(--ok);background:rgba(14,159,110,.12)">${SVG.check}</div>

          <a class="btn s" href="#/my-orders">View All My Orders</a>
        </div>
      </div>`;
    } catch(err) {
      alert('Order submission error: ' + err.message);
      if (btn) { btn.disabled = false; btn.textContent = 'Submit Order'; }
    }
  },

  async viewRequest(id) {

      A.modal();

Object.assign(A, {
  async toggleMilestone(milestoneId, ev) {
    const scrollPos = window.scrollY;
    if (ev && ev.target) {
      const chk = ev.target;
      const isDone = chk.checked;
      const label = chk.closest('label');
      if (label) {
        label.classList.toggle('d', isDone);
        const badge = label.querySelector('.bd');
        if (badge) {
          badge.className = `bd ${isDone ? 'ok' : 'n'}`;
          badge.textContent = isDone ? 'Done' : 'Pending';
        }
      }
    }
    for (const r of S.reqs) {
      if (r.milestones) {
        const m = r.milestones.find(x => x.id === milestoneId);
        if (m) {
          m.done = !m.done;
          const doneCount = r.milestones.filter(x => x.done).length;
          r.progress = Math.round((doneCount / r.milestones.length) * 100);
          r.status = r.progress === 100 ? 'Completed' : (r.progress > 0 ? 'In Progress' : 'Pending');
          break;
        }
      }
    }
    try {
      const res = await apiFetch(`/api/requests/milestones/${milestoneId}/toggle`, { method: 'POST' });
      if (!res.ok) throw new Error((await res.json()).message || 'Failed');
      await A.loadRequests();
      R(true);
      window.scrollTo?.(0, scrollPos);
    } catch(err) {
      alert('Error: ' + err.message);
      await A.loadRequests();
      R(true);
      window.scrollTo?.(0, scrollPos);
    }
  },

  getInstantQuestion(category, index) {
    const norm = (category || 'Printing').toLowerCase();
    let catKey = 'Printing';
    if (norm.includes('bake') || norm.includes('food')) catKey = 'Bakery';
    else if (norm.includes('dev') || norm.includes('software')) catKey = 'Software Development';
    else if (norm.includes('design') || norm.includes('creative')) catKey = 'Design Agency';
    const list = ONB_QUESTION_BANK[catKey] || ONB_QUESTION_BANK['Printing'];
    const idx = Math.min(Math.max(0, index), list.length - 1);
    const q = list[idx];
    return {
      ...q,
      questionIndex: idx,
      isComplete: idx >= list.length - 1
    };
  },

  // Onboarding
  onbStartQuestions() {
    const name = ($('#onb_bn')?.value || '').trim();
    if (!name) { document.querySelector('[data-e=onb_bn]') && (document.querySelector('[data-e=onb_bn]').textContent = 'Please enter your business name.'); return; }
    S.onbState.name = name;
    S.onbState.desc = `${name} (${S.onbState.category})`;
    S.onbState.step = 'questioning';
    S.onbState.currentIndex = 0;
    S.onbState.history = [];
    S.onbState.currentSelection = null;
    S.onbState.customText = '';
    S.onbState.error = '';
    S.onbState.prefetchedQuestion = null;
    // Instant question appearance — 0ms delay!
    S.onbState.currentQuestion = A.getInstantQuestion(S.onbState.category, 0);
    R();
    // Non-blocking prefetch in background
    A.onbPrefetchQuestion(1);
  },

  async onbPrefetchQuestion(targetIndex) {
    if (targetIndex >= 6) return;
    try {
      const res = await apiFetch('/api/onboarding/next-question', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ businessName: S.onbState.name, description: S.onbState.desc, category: S.onbState.category, questionIndex: targetIndex, history: S.onbState.history })
      });
      if (res.ok) {
        const data = await res.json();
        if (data && data.question) {
          S.onbState.prefetchedQuestion = data;
        }
      }
    } catch(e) {}
  },

  async onbFetchNextQuestion() {
    S.onbState.error = '';
    S.onbState.currentSelection = null;
    S.onbState.customText = '';
    if (!S.onbState.currentQuestion || S.onbState.currentQuestion.questionIndex !== S.onbState.currentIndex) {
      S.onbState.currentQuestion = A.getInstantQuestion(S.onbState.category, S.onbState.currentIndex);
      R();
    }
    try {
      const res = await apiFetch('/api/onboarding/next-question', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ businessName: S.onbState.name, description: S.onbState.desc, category: S.onbState.category, questionIndex: S.onbState.currentIndex, history: S.onbState.history })
      });
      if (res.ok) {
        const data = await res.json();
        if (data && data.question) {
          S.onbState.currentQuestion = data;
          R();
        }
      }
    } catch(err) {}
  },

  onbSelectOption(val) {
    const q = S.onbState.currentQuestion;
    if (!q) return;
    if (q.type === 'msq') {
      let arr = Array.isArray(S.onbState.currentSelection) ? [...S.onbState.currentSelection] : [];
      S.onbState.currentSelection = arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val];
    } else {
      S.onbState.currentSelection = val;
    }
    R();
  },

  async onbSubmitAnswerAndContinue() {
    const q = S.onbState.currentQuestion;
    if (!q) return;
    let finalAnswer = S.onbState.currentSelection;
    if (q.type === 'msq') {
      if (!Array.isArray(finalAnswer) || finalAnswer.length === 0) { S.onbState.error = 'Please select at least one option.'; R(); return; }
    } else {
      if (!finalAnswer) { S.onbState.error = 'Please choose an option to continue.'; R(); return; }
    }
    S.onbState.history.push({ questionId: q.questionId, question: q.question, type: q.type, answer: finalAnswer, customText: S.onbState.customText.trim() });
    S.onbState.currentIndex++;
    if (q.isComplete || S.onbState.currentIndex >= 6) {
      await A.onbGenerateWorkspace();
    } else {
      const nextIdx = S.onbState.currentIndex;
      if (S.onbState.prefetchedQuestion && S.onbState.prefetchedQuestion.questionIndex === nextIdx) {
        S.onbState.currentQuestion = S.onbState.prefetchedQuestion;
        S.onbState.prefetchedQuestion = null;
      } else {
        S.onbState.currentQuestion = A.getInstantQuestion(S.onbState.category, nextIdx);
      }
      S.onbState.currentSelection = null;
      S.onbState.customText = '';
      S.onbState.error = '';
      R();
      A.onbPrefetchQuestion(nextIdx + 1);
    }
  },

  onbGoBackOneQuestion() {
    if (S.onbState.currentIndex > 0) {
      S.onbState.currentIndex--;
      const prev = S.onbState.history.pop();
      S.onbState.currentQuestion = A.getInstantQuestion(S.onbState.category, S.onbState.currentIndex);
      S.onbState.currentSelection = prev?.answer || null;
      S.onbState.customText = prev?.customText || '';
      S.onbState.error = '';
      R();
    } else { S.onbState.step = 'profile'; R(); }
  },

  async onbGenerateWorkspace() {
    S.onbState.loading = true; S.onbState.error = ''; R();
    const answersMap = {};
    S.onbState.history.forEach((h, i) => { answersMap[h.questionId || `q_${i+1}`] = { question: h.question, answer: h.answer, custom: h.customText }; });
    try {
      const res = await apiFetch('/api/onboarding/generate-workspace', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ businessName: S.onbState.name, category: S.onbState.category, description: S.onbState.desc, answers: answersMap })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed');
      S.onbState.workspaceConfig = data;
      S.onbState.step = 'workspace';
    } catch(err) { S.onbState.error = err.message; }
    finally { S.onbState.loading = false; R(); }
  },

  async onbSaveAndLaunch() {
    S.onbState.loading = true; S.onbState.error = ''; R();
    const workingHours = $('#onb_wh')?.value || 'Mon–Fri, 9:00–17:00';
    const capacity = parseInt($('#onb_cp')?.value, 10) || S.onbState.workspaceConfig?.initialCapacity || 5;
    try {
      const res = await apiFetch('/api/onboarding/save-session', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ businessName: S.onbState.name, category: S.onbState.category, description: S.onbState.desc, answers: S.onbState.history, workspaceConfig: S.onbState.workspaceConfig, services: S.onbState.workspaceConfig?.services || ['Custom Orders'], workingHours, capacity, published: true })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed to save business');
      S.biz = data.business;
      try { localStorage.setItem('pp-current-biz-id', data.businessId); } catch(e) {}
      await A.loadBusinesses();
      await A.loadRequests();
      showToast('Business workspace launched!');
      A.switchPortal('owner');
    } catch(err) { S.onbState.error = err.message; }
    finally { S.onbState.loading = false; R(); }
  },

  async loadBusinesses() {
    S.marketLoading = true;
    try {
      const [mktRes, allRes] = await Promise.all([apiFetch('/api/businesses'), apiFetch('/api/businesses?all=1')]);
      const mktData = await mktRes.json(); const allData = await allRes.json();
      if (mktData?.businesses) S.marketList = mktData.businesses;
      if (allData?.businesses) {
        S.allBizList = allData.businesses; S.bizList = allData.businesses;
        const savedId = localStorage.getItem('pp-current-biz-id');
        if (savedId) { const f = S.allBizList.find(b => b.id === savedId); if (f) S.biz = f; }
        if (!S.biz && S.allBizList.length) S.biz = S.allBizList[0];
      }
    } catch(err) { console.warn('Load businesses:', err); }
    finally { S.marketLoading = false; }
  },

    try {
      const res = await apiFetch('/api/requests');
      const data = await res.json();
      if (data?.requests) S.reqs = data.requests;
      if (S.biz?.id) {
        try {
          const mlRes = await apiFetch(`/api/requests/recovery/analysis?businessId=${encodeURIComponent(S.biz.id)}`);
          if (mlRes.ok) S.recoveryAnalysis = await mlRes.json();
        } catch(_) {}
        try {
          const rRes = await apiFetch(`/api/requests/resources?businessId=${encodeURIComponent(S.biz.id)}`);
          if (rRes.ok) S.resourcesData = await rRes.json();
        } catch(_) {}
      }
    } catch(err) { console.warn('Load requests:', err); }
  },

    try { const res = await apiFetch('/api/health'); S.health = await res.json(); }
    catch(e) { S.health = { status: 'healthy', ml: { ready: true }, ai: { fallbackReady: true } }; }

  // Batch recovery: execute multiple selected actions in one API call
  async applySelectedRecoveryActions(businessId) {
    const checkboxes = document.querySelectorAll('.recovery-action-cb:checked');
    if (!checkboxes.length) {
      showToast('Select at least one recovery action to apply.', true);
      return;
    }
    const actions = Array.from(checkboxes).map(cb => JSON.parse(decodeURIComponent(cb.dataset.action)));
    const btn = document.getElementById('batch-recovery-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Applying...'; }
    try {
      const res = await apiFetch('/api/requests/recovery/batch-action', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ businessId, actions })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Batch action failed');
      showToast(`✓ ${data.executedCount} of ${data.totalCount} actions applied. ${data.remainingRiskCount} risks remaining.`);
      await A.loadRequests();
      R();
    } catch(err) {
      alert('Batch execution error: ' + err.message);
      if (btn) { btn.disabled = false; btn.textContent = 'Apply Selected Actions'; }
    }
  },

    const val = parseFloat(newAvail);

      alert('Validation Error: Stock quantity must be a non-negative number.');
      return;

    try {

  async placeReorder(resourceId, quantity) {
    try {
      const res = await apiFetch(`/api/requests/resources/${resourceId}/reorder`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quantity })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed to place reorder');
      A.modal(`
        <div class="emp" style="border-color:var(--ok)">
          <div class="ic" style="color:var(--ok);background:rgba(14,159,110,.14)">${SVG.check}</div>

          <p>Order ID: <b>${data.orderId}</b> &middot; Total: <b>$${data.totalCost}</b></p>

          <div class="row" style="justify-content:center;margin-top:16px;gap:12px">
            <button class="btn ok-btn" onclick="A.confirmDelivery('${resourceId}', ${data.quantity})">✓ Confirm Delivery & Add to Stock</button>

          </div>
        </div>
      `);
      await A.loadRequests();
    } catch(err) { alert('Reorder error: ' + err.message); }
  },

  async confirmDelivery(resourceId, quantity) {
    try {
      const res = await apiFetch(`/api/requests/resources/${resourceId}/confirm-delivery`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quantity })
      });
      if (!res.ok) throw new Error((await res.json()).message || 'Failed');
      showToast('Delivery confirmed and inventory stock updated!');
      A.modal();
      await A.loadRequests();
      R();
    } catch(err) { alert('Error: ' + err.message); }
  },

  async deleteResource(resourceId) {
    if (!confirm('Delete this resource?')) return;
    try {
      const res = await apiFetch(`/api/requests/resources/${resourceId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error((await res.json()).message || 'Failed');
      await A.loadRequests();
      showToast('Resource removed.');
      R();
    } catch(err) { alert('Error: ' + err.message); }
  },

  navigateToRecovery(riskId) {
    S.selectedRiskId = riskId;
    location.hash = '#/owner/recovery';
    R();
  }

  'owner/projects': () => {
    const bizReqs = S.reqs.filter(r => S.biz ? r.businessId === S.biz.id : true);

    const accepted = bizReqs.filter(r => r.status === 'Accepted' && r.project);
    const analysisProjects = S.recoveryAnalysis?.activeProjects || [];

    return owner('projects', `

        <div>
          <h1 style="font-size:2rem;margin:0">Active Projects & Milestones</h1>
          <p class="mu" style="margin:4px 0 0">Interactive milestones update progress and trigger live supervised ML predictions.</p>

        <button class="btn s" onclick="A.loadRequests().then(()=>R())">Refresh</button>

          <div class="row sp">
            <div>
              <b style="color:var(--print-tx)">You have ${newCount} new incoming customer order${newCount > 1 ? 's' : ''} waiting to be accepted.</b>
              <p class="sm" style="color:var(--print-tx);margin:2px 0 0">Accepting an order automatically creates its project and generates category milestones.</p>
            </div>
            <a class="btn" style="background:var(--print-acc);border-color:transparent;color:#fff" href="#/owner/requests">Review & Accept Orders →</a>
          </div>
        </div>
      ` : ''}

      ${accepted.length ? `<div class="grid">${accepted.map(r => {
        const p = r.project;
        const totalMs = (p.milestones || []).length || 5;
        const doneMs = (p.milestones || []).filter(m => m.done).length;
        const remMs = totalMs - doneMs;
        const isCompleted = p.progressPercentage >= 100 || p.status === 'Completed';

        const pred = isCompleted ? null : analysisProjects.find(ap => ap.id === p.id);
        const mlProb = isCompleted ? 0 : (pred ? pred.mlDelayPercentage : (remMs > 2 ? 65 : 15));
        const rl = isCompleted ? 'None' : (pred ? pred.mlRiskLevel : (mlProb >= 70 ? 'High' : mlProb >= 35 ? 'Medium' : 'Low'));
        const estRemaining = isCompleted ? 0 : (pred ? pred.mlEstimatedRemainingDays : Math.max(1, Math.round(remMs * 1.5)));
        const expDate = isCompleted ? 'Completed' : (pred ? pred.mlExpectedCompletionDate : r.deadline);
        const delayDays = isCompleted ? 0 : (pred ? pred.mlExpectedDelayDays : 0);
        const factors = isCompleted ? ['Project completed successfully.'] : (pred?.mlContributingFactors || ['Operations progressing within planned buffer thresholds.']);

        const rc = isCompleted ? 'ok' : riskClass(rl);
        const cardBorderColor = isCompleted ? 'var(--ok)' : (mlProb >= 60 ? '#D14343' : mlProb >= 35 ? '#C27803' : 'var(--ok)');

        return `
          <div class="card" style="margin-bottom:20px;border-top:4px solid ${cardBorderColor}">
            <div class="row sp" style="margin-bottom:8px">
              <div>
                <h3 style="margin:0">${esc(r.requestTitle)}</h3>
                <p class="sm mu" style="margin:3px 0 0">Client: <b>${esc(r.customer_name || 'Client')}</b> &middot; Due: <b>${esc(r.deadline)}</b> &middot; Budget: <b>$${esc(r.budget)}</b></p>
              </div>
              <div class="row" style="gap:8px">
                ${isCompleted
                  ? `<span class="bd ok" style="background:rgba(14,159,110,.1);font-weight:700">✓ Completed Successfully</span>`
                  : `<span class="bd ${rc}">${mlProb}% Delay Risk (${riskLabel(mlProb)})</span>`
                }
                <span class="bd ok">${p.progressPercentage}% Done</span>

        <h3>No active projects</h3>
        <p class="mu">Go to your Requests section and accept an incoming order to generate project milestones.</p>

  // ---- WORKLOAD ----
  'owner/workload': () => {
    const D = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const active = S.reqs.filter(r => (S.biz ? r.businessId === S.biz.id : true) && r.status === 'Accepted');
    const cap = S.biz?.capacity || 5;
    const overloaded = active.length > cap;
    // Build ML risk lookup from recoveryAnalysis
    const analysisProjects = S.recoveryAnalysis?.activeProjects || [];
    function getProjectRiskLevel(r) {
      if (!r.project) return 'Low';
      if ((r.project.progressPercentage || 0) >= 100 || r.project.status === 'Completed') return 'Completed';
      const pred = analysisProjects.find(ap => ap.id === r.project?.id);
      if (!pred) return 'Low';
      return pred.mlRiskLevel || 'Low';
    }
    function wkChipStyle(rl) {
      if (rl === 'Completed') return 'background:rgba(14,159,110,.12);border:1px solid rgba(14,159,110,.3);color:var(--ok)';
      if (rl === 'Critical' || rl === 'High') return 'background:rgba(209,67,67,.12);border:1px solid rgba(209,67,67,.35);color:#D14343';
      if (rl === 'Medium') return 'background:rgba(194,120,3,.10);border:1px solid rgba(194,120,3,.35);color:#C27803';
      return 'background:var(--g);border:1px solid var(--bd);color:var(--tx)';
    }

    return owner('workload', `
      <div class="row sp" style="margin-bottom:8px">
        <h1 style="font-size:2rem;margin:0">Weekly Workload Schedule</h1>
        <span class="bd ${overloaded ? 'er' : 'ok'}">${active.length}/${cap} Active Slots</span>
      </div>
      <p class="mu" style="margin-bottom:8px">Active projects plotted across delivery deadlines. <span style="color:#D14343;font-weight:600">Red chips</span> = ML-detected delay risk.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        <span style="display:flex;align-items:center;gap:5px;font-size:.82rem"><span style="width:12px;height:12px;border-radius:50%;background:rgba(209,67,67,.5);display:inline-block"></span>High/Critical Risk</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:.82rem"><span style="width:12px;height:12px;border-radius:50%;background:rgba(194,120,3,.5);display:inline-block"></span>Medium Risk</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:.82rem"><span style="width:12px;height:12px;border-radius:50%;background:rgba(14,159,110,.5);display:inline-block"></span>On Track / Completed</span>
      </div>
      <div class="wk">
        ${D.map((d, i) => `<div>
          <b>${d}</b>
          ${active.filter(r => r.deadline && (new Date(r.deadline + 'T00:00').getDay() + 6) % 7 === i).map(r => {
            const rl = getProjectRiskLevel(r);
            return `<p style="margin:6px 0 0"><a href="#/owner/projects" style="font-size:.75rem;display:block;padding:4px 7px;border-radius:8px;text-decoration:none;font-weight:600;${wkChipStyle(rl)}">${esc(r.requestTitle.slice(0, 18))}</a></p>`;
          }).join('')}
        </div>`).join('')}
      </div>
    `);
  },

  // ---- RESOURCES (Card Grid, 12 Items, Clean SVG Icons, Reordering with PayPal) ----
  'owner/resources': () => {
    if (!S.biz) return owner('resources', '<p class="mu">Select a business workspace first.</p>');
    const rid = S.biz.id;

    setTimeout(async () => {
      const el = document.getElementById('resources-body');
      if (!el) return;
      try {
        const res = await apiFetch(`/api/requests/resources?businessId=${encodeURIComponent(rid)}`);
        const data = await res.json();
        const shortages = data.shortages || [];
        const resources = data.resources || [];

        el.innerHTML = `
          <div class="grid g3" style="margin-bottom:20px">
            <div class="card" style="text-align:center"><div class="mu sm">Total Resources</div><div style="font-size:2rem;font-weight:800;color:var(--pri);margin:4px 0">${resources.length}</div></div>
            <div class="card" style="text-align:center"><div class="mu sm">Shortages</div><div style="font-size:2rem;font-weight:800;color:${shortages.length ? '#D14343' : 'var(--ok)'};margin:4px 0">${shortages.length}</div></div>
            <div class="card" style="text-align:center"><div class="mu sm">Inventory Health</div><div style="font-size:1.15rem;font-weight:700;color:${shortages.length ? '#D14343' : 'var(--ok)'};margin:8px 0">${shortages.length ? 'Stock Deficit Detected' : 'All Resources Sufficient'}</div></div>
          </div>

          ${shortages.length ? `
            <div class="card" style="border-left:5px solid #D14343;background:rgba(209,67,67,.04);margin-bottom:24px">
              <div class="row sp">
                <div>
                  <b style="color:#D14343">${shortages.length} Material Shortage${shortages.length > 1 ? 's' : ''} Identified</b>
                  <p class="sm" style="margin:4px 0 0">${shortages.map(s => `<b>${esc(s.name)}</b>: Missing ${s.deficit} ${esc(s.unit)} (${s.leadTimeDays}d lead time)`).join(' &middot; ')}</p>
                </div>
                <a class="btn s" href="#/owner/recovery" style="border-color:#D14343;color:#D14343">Open Recovery Plan →</a>

          <h3 style="margin:0 0 14px">Tracked Inventory & Capacities</h3>
          <div class="grid g3">
            ${resources.map(r => {
              const isShortage = r.available_quantity < r.required_quantity;
              const pct = r.required_quantity > 0 ? Math.min(100, Math.round((r.available_quantity / r.required_quantity) * 100)) : 100;
              const typeIcon = r.type === 'equipment' ? SVG.gear : r.type === 'staff' ? SVG.user : r.type === 'service' ? SVG.cloud : SVG.box;

              return `
                <div class="res-card ${isShortage ? 'shortage' : ''}">
                  <div class="row sp" style="margin-bottom:8px">
                    <span style="color:var(--pri)">${typeIcon}</span>
                    <span class="bd ${isShortage ? 'er' : 'ok'}" style="font-size:.72rem">${isShortage ? 'Shortage' : 'Available'}</span>
                  </div>
                  <b style="font-size:1rem;display:block;margin-bottom:2px">${esc(r.name)}</b>
                  <span class="sm mu">${esc(r.type)} &middot; $${r.cost_per_unit || 0}/${esc(r.unit)}</span>
                  
                  <div class="pg" style="margin:12px 0 10px"><b style="width:${pct}%;background:${isShortage ? '#D14343' : 'var(--ok)'}"></b></div>
                  
                  <div class="sm mu" style="margin-bottom:14px">
                    <div class="row sp"><span>Available:</span><b>${r.available_quantity} ${esc(r.unit)}</b></div>
                    <div class="row sp" style="margin-top:2px"><span>Required:</span><b>${r.required_quantity} ${esc(r.unit)}</b></div>
                    <div class="row sp" style="margin-top:2px"><span>Supplier Lead:</span><b>${r.supplier_lead_time_days || 0} days</b></div>
                  </div>

                  <div class="row" style="gap:6px">
                    <button class="btn s" style="flex:1;font-size:.78rem;padding:.35em .6em" onclick="
                      const n = prompt('Enter new available quantity for ${esc(r.name)}:','${r.available_quantity}');
                      if (n !== null) A.updateResourceStock('${r.id}', n);
                    ">Update Stock</button>
                    ${isShortage ? `
                      <button class="btn paypal" style="font-size:.78rem;padding:.35em .7em" onclick="A.openReorderModal('${r.id}','${esc(r.name)}',${r.cost_per_unit || 10},'${esc(r.unit)}',${r.supplier_lead_time_days || 3})">
                        Reorder
                      </button>
                    ` : ''}
                    <button class="btn s d" style="font-size:.78rem;padding:.35em .6em" onclick="A.deleteResource('${r.id}')">Del</button>
                  </div>

              `;
            }).join('')}

      } catch(e) {

      }

    return owner('resources', `
      <div class="row sp" style="margin-bottom:16px">
        <div>
          <h1 style="font-size:2rem;margin:0">Resource Intelligence</h1>
          <p class="mu" style="margin:4px 0 0">Raw materials, production equipment, and staff capacity for <b>${esc(S.biz.name)}</b>.</p>
        </div>
        <button class="btn s" onclick="R()">Refresh</button>
      </div>
      <div id="resources-body"><div class="emp"><div class="ld" style="margin:0 auto 14px"></div><p class="mu">Loading inventory...</p></div></div>
    `);
  },

  // ---- RECOVERY CENTRE (Combined Risk View, 5-Stage Flowchart, Strategy Options, Direct Project Navigation) ----

      try {

        const data = await res.json();
        const plans = data.recoveryPlans || [];

                <div class="row sp" style="padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer" onclick="document.getElementById('plan-${p.id}')?.scrollIntoView({behavior:'smooth'})">
                  <div>
                    <div class="row" style="gap:8px">
                      <span class="bd ${p.severity==='Critical'?'er':'wa'}">${p.severity}</span>
                      <b>${esc(p.title)}</b>
                    </div>

                  </div>

              `).join('')}</div>
            </div>

            <!-- Detailed Recovery Plans & Flowchart -->
            ${plans.map((plan, planIdx) => `
              <div id="plan-${plan.id}" class="card" style="margin-bottom:24px;border-left:5px solid ${plan.severity==='Critical' ? '#D14343' : '#C27803'}">
                <div class="row sp" style="margin-bottom:12px">
                  <div>
                    <span class="bd ${plan.severity==='Critical'?'er':'wa'}">${plan.severity}</span>
                    <h3 style="margin:8px 0 2px">${esc(plan.title)}</h3>
                    <p class="sm mu" style="margin:0">Affecting: <b>${esc(plan.affectedEntity)}</b></p>

                  <span class="bd ${plan.status==='approved'?'ok':'n'}">${plan.status.toUpperCase()}</span>

                  <div style="font-size:.75rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px">5-Stage Recovery Decision Flow</div>
                  <div style="display:flex;gap:8px;align-items:center;overflow-x:auto">
                    <div class="flow-step" style="border:2px solid #D14343;background:rgba(209,67,67,.06)">

                      <b style="font-size:.82rem;color:var(--pri)">${esc((plan.flowchart?.step3_recommendation||'Reorder Stock').split(' ').slice(0,3).join(' '))}</b>

                    <div class="flow-arr">→</div>
                    <div class="flow-step" style="border:2px solid var(--ok);background:rgba(14,159,110,.06)">
                      <span style="font-size:.65rem;font-weight:800;color:var(--ok);text-transform:uppercase;display:block">4. Result</span>
                      <b style="font-size:.82rem;color:var(--ok)">${esc((plan.flowchart?.step4_impact||'Recovers Schedule').split(' ').slice(0,3).join(' '))}</b>

                    }));

                  <button class="btn s d" style="font-size:.82rem" onclick="A.rejectRecoveryPlan('${rid}','${plan.id}')">✕ Reject Plan</button>

            <!-- Batch Apply Button (shown when multiple plans are displayed) -->

          ` : `<div class="emp">
            <div class="ic" style="color:var(--ok)">${SVG.check}</div>

        el.innerHTML = `<p style="color:var(--er)">Error analyzing recovery risks: ${esc(e.message)}</p>`;
      }
    }, 50);

    return owner('recovery', `
      <div class="row sp" style="margin-bottom:16px">
        <div>
          <h1 style="font-size:2rem;margin:0">Adaptive Recovery Centre</h1>
          <p class="mu" style="margin:4px 0 0">Real-time risk assessment, automated recovery pathways, and owner execution decisions.</p>

          <div class="row sp"><span class="mu">Environment:</span><b>PayPal Developer Sandbox</b></div>
          <div class="row sp" style="margin-top:6px"><span class="mu">Mode:</span><b>REST API v2 Orders</b></div>
          <div class="row sp" style="margin-top:6px"><span class="mu">Currency:</span><b>USD ($)</b></div>
        </div>
        <button class="btn paypal" onclick="alert('PayPal Sandbox active: Connects to official developer sandbox endpoints for verified checkout.')">
          ${SVG.paypal} Test PayPal Sandbox Connectivity
        </button>
      </div>

      <div class="card">
        <h3>Transaction Workflow</h3>
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
          ${[
            'Customer orders catalog item with auto-calculated pricing',
            'Order captured via PayPal Sandbox REST API',
            'Owner reviews and accepts order in Business Portal',
            'Tailored milestones created and tracked in Active Projects',
            'Supplier restocks ordered with PayPal checkout upon shortage'
          ].map((text, idx) => `
            <div class="row" style="gap:10px">
              <span class="bd" style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;padding:0">${idx + 1}</span>
              <span class="sm">${text}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `),

  // ---- SETTINGS & WORKSPACES ----
  'owner/settings': () => {
    const biz = S.biz;
    const isPublished = Boolean(biz?.published);
    return owner('settings', `
      <h1 style="font-size:2rem;margin-bottom:6px">Settings & Workspaces</h1>
      <p class="mu" style="margin-bottom:22px">Manage profile, concurrent capacities, multiple businesses and data state.</p>

      ${biz ? `
      <div class="card" style="margin-bottom:20px;border-top:4px solid ${getCatAccent(biz.category)}">
        <div class="row sp" style="margin-bottom:16px">
          <div>
            <h3 style="margin:0">${esc(biz.name)}</h3>
            <p class="mu sm" style="margin:4px 0 0">${esc(biz.category)}</p>
          </div>
          ${isPublished ? '<span class="bd ok">Listed in Marketplace</span>' : '<span class="bd">Draft</span>'}
        </div>

        <div style="background:var(--g);border-radius:14px;padding:16px;margin-bottom:16px">
          <b style="display:block;margin-bottom:4px">Marketplace Visibility</b>
          <p class="sm mu" style="margin:0 0 12px">${isPublished ? 'Your business is visible to customers in the marketplace.' : 'Your business is currently hidden.'}</p>
          <button class="btn ${isPublished ? 'd' : 'ok-btn'}" onclick="A.publishBusiness('${esc(biz.id)}', ${!isPublished})">
            ${isPublished ? 'Unlist from Marketplace' : 'Publish to Marketplace'}
          </button>
        </div>

        <div style="background:var(--g);border-radius:14px;padding:16px;margin-bottom:16px">
          <b style="display:block;margin-bottom:4px">Concurrent Active Capacity</b>
          <p class="sm mu" style="margin:0 0 12px">Max active customer projects before overload alerts trigger.</p>
          <div class="row" style="gap:10px">
            <input id="cap-input" type="number" min="1" max="50" value="${esc(biz.capacity || 5)}" style="width:80px">
            <button class="btn s" onclick="A.updateCapacity('${esc(biz.id)}', document.getElementById('cap-input').value)">Save Capacity</button>
          </div>
        </div>

        <div class="row sp" style="padding-top:16px;border-top:1px solid var(--bd)">
          <button class="btn s d" onclick="A.deleteBusiness('${esc(biz.id)}')">Delete This Business</button>
          <a class="btn s" href="#/owner/onboarding">+ Register Another Business</a>
        </div>
      </div>
      ` : '<div class="emp"><h3>No business workspace</h3><a class="btn" href="#/owner/onboarding">Register Business →</a></div>'}

      <!-- Multiple Workspaces Switcher -->
      ${S.allBizList.length > 1 ? `
        <div class="card" style="margin-bottom:20px">
          <h3 style="margin:0 0 14px">Registered Workspaces (${S.allBizList.length})</h3>
          ${S.allBizList.map(ob => `
            <div class="row sp" style="padding:10px 0;border-bottom:1px solid var(--bd)">
              <div>
                <b>${esc(ob.name)}</b>
                <span class="sm mu" style="margin-left:8px">${esc(ob.category)}</span>
                ${ob.id === biz?.id ? '<span class="bd ok" style="margin-left:6px">Active</span>' : ''}
              </div>
              <div class="row" style="gap:8px">
                ${ob.id !== biz?.id ? `<button class="btn s" style="font-size:.82rem" onclick="A.switchBusiness('${ob.id}')">Switch</button>` : ''}
                <button class="btn s d" style="font-size:.82rem" onclick="A.deleteBusiness('${ob.id}')">Delete</button>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}

      <!-- Reset Data -->
      <div class="card" style="border-color:#D14343;background:rgba(209,67,67,.03)">
        <h3 style="color:#D14343;margin:0 0 6px">Reset All Application Data</h3>
        <p class="sm mu" style="margin:0 0 14px">Clears all businesses, orders, projects and resources to start fresh for a live presentation. Trained ML models and datasets remain intact.</p>
        <button class="btn s d" onclick="A.resetAllData()" style="border-color:#D14343;color:#D14343">Reset All Application Data</button>
      </div>
    `);
  }
};

function R(preserveScroll = false) {
  const scrollPos = preserveScroll ? window.scrollY : 0;
  const h = (location.hash.slice(2) || '').split('/');
  let k = h[0], id = h[1];
  if (k === 'owner') { k = 'owner/' + (h[1] || 'dashboard'); id = h[2]; }
  const f = P[k] || P[''];
  document.getElementById('app').innerHTML = f(id);
  if (preserveScroll) {
    window.scrollTo?.(0, scrollPos);
  } else {
    window.scrollTo?.(0, 0);
  }
}

try { const t = localStorage.getItem('pp-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}

addEventListener('hashchange', () => { A.modal(); S.sidebar = 0; R(); });

(async () => {
  await A.loadHealth();
  await A.loadBusinesses();
  await A.loadRequests();
  R();
})();
</script>
</body>
</html>
